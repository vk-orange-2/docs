        - total
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    ServiceListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ConfigListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BaseConfig'
        pagination:
          $ref: '#/components/schemas/Pagination'

    VersionListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VersionInfo'
        pagination:
          $ref: '#/components/schemas/Pagination'

    AuditListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
