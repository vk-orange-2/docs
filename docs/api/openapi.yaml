        - name
        - namespace
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        serviceKey:
          type: string
        name:
          type: string
        namespace:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuditEvent:
      type: object
      required:
        - id
        - operation
        - entityType
        - actorId
        - actorType
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        operation:
          type: string
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
          nullable: true
        serviceId:
          type: string
          format: uuid
          nullable: true
        configId:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
          format: int64
          nullable: true
        actorId:
          type: string
        actorType:
          type: string
          enum: [user, service]
        sourceIp:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        diff:
          type: object
          nullable: true
          additionalProperties: true
        meta:
          type: object
          nullable: true
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    Pagination:
      type: object
      required:
